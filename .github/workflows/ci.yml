# Step 1 — Continuous Integration (CI)
# Runs on every push and PR to main: restore → build (strict) → test → pack → upload artifacts.
# Does NOT publish to NuGet (that is Step 2 — release.yml).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore Odex.AspNetCore.Clarc.Domain.sln

      - name: Build (Release, warnings as errors)
        run: >
          dotnet build Odex.AspNetCore.Clarc.Domain.sln
          -c Release
          --no-restore
          -p:ContinuousIntegrationBuild=true
          -p:TreatWarningsAsErrors=true

      - name: Test
        run: >
          dotnet test Odex.AspNetCore.Clarc.Domain.sln
          -c Release
          --no-build
          --verbosity normal

      - name: Pack (verify NuGet layout)
        run: >
          dotnet pack Odex.AspNetCore.Clarc.Domain/Odex.AspNetCore.Clarc.Domain.csproj
          -c Release
          --no-build
          -o artifacts

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
